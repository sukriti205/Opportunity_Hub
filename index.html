    function App() {
      // Routing state: 'home', 'redirect-page', 'dashboard'
      const [currentPage, setCurrentPage] = useState(() => {
        const hash = window.location.hash;
        if (hash === '#dashboard') return 'dashboard';
        if (hash === '#redirect') return 'redirect-page';
        return 'home';
      });

      // LocalStorage backed states
      const [opportunities, setOpportunities] = useState(() => {
        const saved = localStorage.getItem('opphub_opps');
        return saved ? JSON.parse(saved) : INITIAL_OPPORTUNITIES;
      });

      const [studentProfile, setStudentProfile] = useState(() => {
        const saved = localStorage.getItem('opphub_profile');
        return saved ? JSON.parse(saved) : INITIAL_STUDENT_PROFILE;
      });

      const [savedIds, setSavedIds] = useState(() => {
        const saved = localStorage.getItem('opphub_saved');
        return saved ? JSON.parse(saved) : ['vol-1', 'int-1', 'cert-1'];
      });

      const [applications, setApplications] = useState(() => {
        const saved = localStorage.getItem('opphub_apps');
        return saved ? JSON.parse(saved) : INITIAL_APPLICATIONS;
      });

      const [selectedOpp, setSelectedOpp] = useState(null);
      const [isAdvertiseOpen, setIsAdvertiseOpen] = useState(false);
      const [isExportOpen, setIsExportOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      // Save on change
      useEffect(() => {
        localStorage.setItem('opphub_opps', JSON.stringify(opportunities));
      }, [opportunities]);
      useEffect(() => {
        localStorage.setItem('opphub_profile', JSON.stringify(studentProfile));
      }, [studentProfile]);
      useEffect(() => {
        localStorage.setItem('opphub_saved', JSON.stringify(savedIds));
      }, [savedIds]);
      useEffect(() => {
        localStorage.setItem('opphub_apps', JSON.stringify(applications));
      }, [applications]);

      // URL Hash listener
      useEffect(() => {
        const onHash = () => {
          if (window.location.hash === '#dashboard') setCurrentPage('dashboard');
          else if (window.location.hash === '#redirect') setCurrentPage('redirect-page');
          else setCurrentPage('home');
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const navigateTo = (page) => {
        setCurrentPage(page);
        if (page === 'dashboard') window.location.hash = '#dashboard';
        else if (page === 'redirect-page') window.location.hash = '#redirect';
        else window.location.hash = '#home';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const toggleSave = (id) => {
        if (savedIds.includes(id)) {
          setSavedIds((prev) => prev.filter((i) => i !== id));
          showToast('Removed from bookmarked opportunities');
        } else {
          setSavedIds((prev) => [...prev, id]);
          showToast('Added to bookmarked opportunities!');
        }
      };

      const handleApplyOrTrack = (opp) => {
        const exists = applications.find((a) => a.opportunityId === opp.id);
        if (exists) {
          showToast('Already tracked in your applications pipeline!');
          return;
        }
        const newApp = {
          id: `app-${Date.now()}`,
          opportunityId: opp.id,
          opportunityTitle: opp.title,
          organization: opp.organization.name,
          category: opp.category,
          status: 'Under Review',
          appliedDate: new Date().toISOString().split('T')[0],
          notes: 'Applied via official portal; awaiting response.'
        };
        setApplications((prev) => [newApp, ...prev]);
        showToast(`Added "${opp.title}" to your applications tracker!`);
      };

        setOpportunities((prev) => [newOpp, ...prev]);

      const calculateScore = (opp) => {
        let score = 50;
        const matches = opp.tags.filter((t) =>
          studentProfile.interests.some(
            (i) => i.toLowerCase().includes(t.toLowerCase()) || t.toLowerCase().includes(i.toLowerCase())
          )
        );
        score += Math.min(30, matches.length * 15);
        if (opp.eligibility.grades.includes(studentProfile.grade)) score += 10;
        if (opp.locationType === 'Remote' || opp.location.toLowerCase().includes('bangalore')) score += 10;
        return Math.min(99, score);
      };

    // --- REUSABLE OPPORTUNITY CARD COMPONENT ---
    function OpportunityCardItem({ opp, isSaved, matchScore, onSelect, onToggleSave, onApply }) {
      const getTheme = (cat) => {
        switch (cat) {
          case 'Volunteering':
            return { pill: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' };
          case 'Internships':
            return { pill: 'bg-indigo-50 text-indigo-700 border-indigo-200', dot: 'bg-indigo-500' };
          case 'Competitions':
            return { pill: 'bg-violet-50 text-violet-700 border-violet-200', dot: 'bg-violet-500' };
          case 'Workshops':
            return { pill: 'bg-amber-50 text-amber-700 border-amber-200', dot: 'bg-amber-500' };
          case 'Certifications':
            return { pill: 'bg-sky-50 text-sky-700 border-sky-200', dot: 'bg-sky-500' };
          default:
            return { pill: 'bg-slate-50 text-slate-700 border-slate-200', dot: 'bg-slate-500' };
        }
      };

      const theme = getTheme(opp.category);

      return (
        <article className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm card-hover flex flex-col justify-between group">
          <div>
            <div className="flex items-center justify-between gap-2 mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${theme.pill}`}>
                  <span className={`w-1.5 h-1.5 rounded-full ${theme.dot}`}></span>
                  {opp.category}
                </span>

                {matchScore !== undefined && (

    // --- PAGE 2: GATEWAY REDIRECT VIEW ---
    function RedirectPageView({ studentProfile, savedCount, applicationsCount, onRedirect }) {
      const [seconds, setSeconds] = useState(3);
      const [paused, setPaused] = useState(false);
      const [triggered, setTriggered] = useState(false);

      useEffect(() => {
        if (paused || triggered) return;
        if (seconds <= 1) {
          setTriggered(true);
          const t = setTimeout(() => onRedirect(), 400);
          return () => clearTimeout(t);
        }
        const interval = setInterval(() => setSeconds((s) => s - 1), 1000);
        return () => clearInterval(interval);
      }, [seconds, paused, triggered, onRedirect]);

      const progress = ((3 - seconds) / 3) * 100;

      return (
        <main id="main-content" className="min-h-[85vh] flex items-center justify-center p-4 sm:p-6 bg-slate-50">
          <div className="max-w-xl w-full bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
            <div className="bg-gradient-to-r from-amber-500 via-indigo-600 to-indigo-700 p-6 text-white text-center">
              <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-black/20 text-xs font-semibold uppercase tracking-wider mb-2">
                <span className="w-2 h-2 rounded-full bg-amber-300 animate-ping"></span>
                Page 2 • Gateway Redirect Portal
              </div>
              <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">
                Redirecting to Student Dashboard
              </h1>
              <p className="text-xs sm:text-sm text-indigo-100 mt-1 max-w-md mx-auto">
                Syncing profile preferences, verified service hours, and application tracking pipeline.
              </p>
            </div>

            <div className="p-6 sm:p-8 space-y-6">
              <div className="flex flex-col items-center justify-center text-center">
                <div className="w-24 h-24 rounded-full border-4 border-indigo-100 flex items-center justify-center bg-indigo-50">
                  <span className="text-4xl font-black text-indigo-600">
                    {triggered ? '🚀' : seconds}
                  </span>
                </div>
                <p className="text-sm font-bold text-slate-800 mt-3">
                  {triggered ? 'Launching Student Dashboard...' : `Redirecting in ${seconds} second${seconds === 1 ? '' : 's'}...`}
                </p>
                <p className="text-xs text-slate-500 mt-0.5">
                  Destination Target: <span className="font-mono text-indigo-600">/student-dashboard/profile</span>
                </p>

                <div className="w-full bg-slate-100 rounded-full h-2.5 mt-4 overflow-hidden border border-slate-200">
                  <div
                    className="bg-indigo-600 h-2.5 rounded-full transition-all duration-1000 ease-linear"
                    style={{ width: `${triggered ? 100 : Math.max(10, progress)}%` }}
                  ></div>
                </div>
              </div>

              <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 space-y-2 text-xs">
                <p className="font-bold text-slate-800 uppercase tracking-wider text-[11px]">
                  Pre-Flight Handshake & Sync Checks:
                </p>
                <div className="flex justify-between text-slate-700">
                  <span>✓ Student Identity:</span>
                  <span className="font-semibold text-slate-900">{studentProfile.name} ({studentProfile.grade})</span>
                </div>
                <div className="flex justify-between text-slate-700">
                  <span>✓ Location & Availability:</span>
                  <span className="font-semibold text-slate-900">{studentProfile.location}</span>
                </div>
                <div className="flex justify-between text-slate-700">
                  <span>✓ Configured Interests:</span>
                  <span className="font-semibold text-indigo-600">{studentProfile.interests.length} Categories</span>
                </div>
                <div className="flex justify-between text-slate-700">
                  <span>✓ Applications & Saved:</span>
                  <span className="font-semibold text-slate-900">{applicationsCount} Applications • {savedCount} Saved</span>
                </div>
              </div>

              <div className="space-y-3">
                <button
                  onClick={() => {
                    setTriggered(true);
                    onRedirect();
                  }}
                  className="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2"
                >
                  <span>Redirect to Student Dashboard Now →</span>
                </button>

                <div className="text-center text-xs font-semibold text-slate-600">
                  <button onClick={() => setPaused(!paused)} className="underline hover:text-indigo-600">
                    {paused ? '▶ Resume Auto-Redirect' : '⏸ Pause Countdown'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </main>
      );
    }

    // --- STUDENT DASHBOARD VIEW ---
    function DashboardView({
      studentProfile,
      onUpdateProfile,
      applications,
      onUpdateAppStatus,
      onRemoveApp,
      opportunities,
      savedIds,
      onToggleSave,
      onSelectOpp,
      onOpenExport,
      onNavigate,

      const [activeTab, setActiveTab] = useState('profile');

      const [editForm, setEditForm] = useState({ ...studentProfile });
      const [statusFilter, setStatusFilter] = useState('All');

      // Portfolio score
      const calcScore = () => {
        let s = 20;
        if (studentProfile.name && studentProfile.bio) s += 20;
        if (studentProfile.interests.length >= 3) s += 20;
        if (savedIds.length >= 1) s += 10;
        if (applications.length >= 1) s += 15;
        if (studentProfile.serviceHoursLogged >= 20) s += 15;
        return Math.min(100, s);
      };
      const score = calcScore();

      const toggleInterest = (tag) => {
        setEditForm((prev) => {
          const exists = prev.interests.includes(tag);
          const next = exists ? prev.interests.filter((i) => i !== tag) : [...prev.interests, tag];
          return { ...prev, interests: next };
        });
      };

      const handleSave = (e) => {
        e.preventDefault();
        onUpdateProfile(editForm);
        setIsEditing(false);
      };

      const savedOpps = opportunities.filter((o) => savedIds.includes(o.id));
      const filteredApps = applications.filter((a) => (statusFilter === 'All' ? true : a.status === statusFilter));

      return (
        <main id="main-content" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 min-h-screen">

                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <h1 className="text-2xl font-bold text-slate-900">{studentProfile.name}</h1>
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-800">

                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">

                  <p className="text-xs text-slate-500 mt-1 flex items-center gap-2 flex-wrap">
                    <span>📍 {studentProfile.location}</span>

                </div>
              </div>

              <button

                <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden border border-slate-200">
                  <div

                      type="text"

              {savedOpps.map((opp) => (
                <OpportunityCardItem
                  key={opp.id}
                  opp={opp}
                  isSaved={true}
                  matchScore={calculateScore(opp)}
                  onSelect={() => onSelectOpp(opp)}
                  onToggleSave={() => onToggleSave(opp.id)}
                  onApply={() => {}}
                />
              ))}
            </div>
          )}

          {/* TAB 3: Custom Feed */}
          {activeTab === 'recommendations' && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {opportunities.map((opp) => (
                <OpportunityCardItem
                  key={opp.id}
                  opp={opp}
                  isSaved={savedIds.includes(opp.id)}
                  matchScore={calculateScore(opp)}
                  onSelect={() => onSelectOpp(opp)}
                  onToggleSave={() => onToggleSave(opp.id)}
                  onApply={() => {}}
                />
              ))}
            </div>
          )}
        </main>
      );
    }

    // --- OPPORTUNITY DETAIL MODAL ---
    function OpportunityModalView({ opportunity, onClose, isSaved, onToggleSave, onApplyOrTrack, isAlreadyApplied }) {
      const [checked, setChecked] = useState({});

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
            <div className="p-6 border-b border-slate-200 bg-slate-50 flex items-start justify-between gap-4">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800">
                  {opportunity.category}
                </span>
                <h2 className="text-xl sm:text-2xl font-bold text-slate-900 mt-1">{opportunity.title}</h2>
                <p className="text-xs text-slate-600 mt-1 font-semibold">{opportunity.organization.name}</p>
              </div>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-700">✕</button>
            </div>

            <div className="p-6 overflow-y-auto space-y-6 text-xs text-slate-700">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div>
                  <p className="text-slate-500 font-medium">Age & Grade</p>
                  <p className="font-bold text-slate-900">{opportunity.eligibility.ageRange}</p>
                </div>
                <div>
                  <p className="text-slate-500 font-medium">Duration</p>
                  <p className="font-bold text-slate-900">{opportunity.duration}</p>
                </div>
                <div>
                  <p className="text-slate-500 font-medium">Location</p>
                  <p className="font-bold text-slate-900">{opportunity.locationType}</p>
                </div>
                <div>
                  <p className="text-slate-500 font-medium">Deadline</p>
                  <p className="font-bold text-amber-700">{opportunity.deadlineFormatted}</p>
                </div>
              </div>

              <div>
                <h3 className="font-bold text-slate-900 uppercase tracking-wider mb-1.5">Overview</h3>
                <p className="leading-relaxed">{opportunity.longDescription || opportunity.description}</p>
              </div>

              <div className="bg-indigo-50/60 rounded-xl p-4 border border-indigo-100">
                <h3 className="font-bold text-indigo-950 mb-2">📋 Eligibility Criteria & Self-Check</h3>
                <div className="space-y-2">
                  {opportunity.eligibility.prerequisites.map((req, idx) => (
                    <label key={idx} className="flex items-start gap-2.5 cursor-pointer bg-white p-2.5 rounded-lg border border-indigo-100">
                      <input
                        type="checkbox"
                        checked={!!checked[idx]}
                        onChange={() => setChecked({ ...checked, [idx]: !checked[idx] })}
                        className="mt-0.5 rounded text-indigo-600"
                      />
                      <span className={checked[idx] ? 'line-through text-slate-400' : ''}>{req}</span>
                    </label>
                  ))}
                </div>
              </div>

              <div>
                <h3 className="font-bold text-slate-900 uppercase tracking-wider mb-2">Verified Perks & Hours</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {opportunity.perks.map((perk, idx) => (
                    <div key={idx} className="p-2.5 bg-slate-50 rounded-lg border border-slate-200 font-medium">
                      🏆 {perk}
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="p-4 sm:p-6 border-t border-slate-200 bg-slate-50 flex items-center justify-between gap-3">
              <button
                onClick={() => onToggleSave(opportunity.id)}
                className="px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs font-semibold"
              >
                {isSaved ? '★ Bookmarked' : '☆ Save to Dashboard'}
              </button>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => onApplyOrTrack(opportunity)}
                  className="px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs font-semibold"
                >
                  {isAlreadyApplied ? '✓ Tracked' : '+ Track Application'}
                </button>
                <a
                  href={opportunity.applicationUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  onClick={() => onApplyOrTrack(opportunity)}
                  className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-200"
                >
                  Official Application Portal ↗
                </a>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- ADVERTISE MODAL ---
    function AdvertiseModalView({ onClose, onAddOpportunity }) {
      const [title, setTitle] = useState('');
      const [orgName, setOrgName] = useState('');
      const [category, setCategory] = useState('Volunteering');
      const [description, setDescription] = useState('');
      const [url, setUrl] = useState('');

      const submit = (e) => {
        e.preventDefault();
        onAddOpportunity({
          id: `custom-${Date.now()}`,
          title,
          organization: { name: orgName, verified: true, type: 'Community Organization' },
          category,
          description,
          longDescription: description,
          eligibility: {
            ageRange: '14 - 18 years',
            grades: 'Grades 9 - 12',
            locationRequirement: 'Remote / Hybrid',
            prerequisites: ['Passionate student', 'Weekly attendance']
          },
          deadline: '2026-12-31',
          deadlineFormatted: 'Dec 31, 2026',
          deadlineType: 'Upcoming',
          duration: '6 Weeks',
          commitment: '3 hrs/week',
          location: 'Remote / Virtual',
          locationType: 'Remote',
          cost: 'Free',
          perks: ['Verified Certificate', 'Service Hours'],
          tags: [category, 'Youth Outreach'],
          applicationUrl: url || 'https://example.org'
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-lg font-bold text-slate-900">Advertise Your Program</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700">✕</button>
            </div>
            <form onSubmit={submit} className="space-y-3 text-xs">
              <div>
                <label className="block font-semibold mb-1">Organization Name *</label>
                <input required value={orgName} onChange={(e) => setOrgName(e.target.value)} className="w-full px-3 py-2 border rounded-lg" placeholder="e.g. Rotary Club" />
              </div>
              <div>
                <label className="block font-semibold mb-1">Program Title *</label>
                <input required value={title} onChange={(e) => setTitle(e.target.value)} className="w-full px-3 py-2 border rounded-lg" placeholder="e.g. Youth Leadership Fellowship" />
              </div>
              <div>
                <label className="block font-semibold mb-1">Category *</label>
                <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-3 py-2 border rounded-lg">
                  <option value="Volunteering">Volunteering</option>
                  <option value="Internships">Internships</option>
                  <option value="Competitions">Competitions</option>
                  <option value="Workshops">Workshops</option>
                  <option value="Certifications">Certifications</option>
                </select>
              </div>
              <div>
                <label className="block font-semibold mb-1">Description *</label>
                <textarea required rows="3" value={description} onChange={(e) => setDescription(e.target.value)} className="w-full px-3 py-2 border rounded-lg" />
              </div>
              <div>
                <label className="block font-semibold mb-1">Application URL *</label>
                <input required type="url" value={url} onChange={(e) => setUrl(e.target.value)} className="w-full px-3 py-2 border rounded-lg" placeholder="https://..." />
              </div>
              <div className="flex justify-end gap-2 pt-3 border-t">
                <button type="button" onClick={onClose} className="px-4 py-2 border rounded-lg">Cancel</button>
                <button type="submit" className="px-5 py-2 bg-indigo-600 text-white rounded-lg font-bold">Publish Program</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- PORTFOLIO EXPORT MODAL ---
    function PortfolioExportModalView({ onClose, studentProfile, applications, opportunities }) {
      const handlePrint = () => window.print();

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-lg font-bold text-slate-900">Extracurricular Portfolio Summary</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700">✕</button>
            </div>

            <div id="printable-resume" className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-3">
              <div className="border-b pb-3">
                <h3 className="text-base font-bold text-slate-900">{studentProfile.name}</h3>
                <p className="text-slate-600">{studentProfile.grade} • {studentProfile.school} • {studentProfile.location}</p>
                <p className="font-bold text-emerald-700 mt-1">{studentProfile.serviceHoursLogged} Verified Service Hours Logged</p>
              </div>
              <div>
                <p className="font-bold text-slate-800">Interests:</p>
                <p className="text-slate-600">{studentProfile.interests.join(', ')}</p>
              </div>
              <div>
                <p className="font-bold text-slate-800">Extracurricular Applications & Initiatives:</p>
                <div className="space-y-1.5 mt-1">
                  {applications.map((a, i) => (
                    <div key={i} className="p-2 bg-white rounded border border-slate-200">
                      <p className="font-bold text-slate-900">{a.opportunityTitle} ({a.status})</p>
                      <p className="text-slate-500">{a.organization} • {a.category}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-4">
              <button onClick={onClose} className="px-4 py-2 border rounded-lg text-xs font-semibold">Close</button>
              <button onClick={handlePrint} className="px-5 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold">
                🖨️ Print / Save as PDF
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MOUNT TO DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
